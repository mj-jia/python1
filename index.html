<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>传图复原 · 本地浏览器版</title>
<style>
  :root{
    --bg:#0e1014; --panel:#171a21; --line:#262b36; --fg:#e8ecf3;
    --dim:#8b95a7; --accent:#4f8cff; --ok:#38c172; --warn:#f6a623;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.6;
  }
  .wrap{max-width:1080px; margin:0 auto; padding:32px 20px 64px}
  h1{font-size:24px; margin:0 0 6px; letter-spacing:.5px}
  .sub{color:var(--dim); font-size:14px; margin-bottom:24px}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px}
  #drop{
    border:2px dashed var(--line); border-radius:12px; padding:44px 20px; text-align:center;
    cursor:pointer; transition:.2s; color:var(--dim);
  }
  #drop:hover,#drop.on{border-color:var(--accent); color:var(--fg); background:#1b2130}
  #drop b{color:var(--fg)}
  .row{display:flex; gap:16px; flex-wrap:wrap; margin-top:18px}
  button{
    background:var(--accent); color:#fff; border:0; border-radius:10px;
    padding:11px 22px; font-size:15px; cursor:pointer; font-weight:600;
  }
  button:disabled{background:#2c3446; color:#6b7488; cursor:not-allowed}
  button.ghost{background:transparent; border:1px solid var(--line); color:var(--fg)}
  #bar{height:6px; background:#222835; border-radius:99px; overflow:hidden; margin-top:16px; display:none}
  #bar>i{display:block; height:100%; width:0; background:linear-gradient(90deg,#4f8cff,#38c172); transition:width .2s}
  #status{font-size:13px; color:var(--dim); margin-top:10px; min-height:20px}
  #view{display:none; margin-top:18px}
  .compare{position:relative; width:100%; border-radius:12px; overflow:hidden; background:#000; touch-action:none}
  .compare canvas{display:block; width:100%; height:auto}
  .compare .after{position:absolute; inset:0; clip-path:inset(0 0 0 50%)}
  .handle{
    position:absolute; top:0; bottom:0; width:2px; background:#fff; left:50%;
    box-shadow:0 0 12px rgba(0,0,0,.7); pointer-events:none;
  }
  .handle::after{
    content:""; position:absolute; top:50%; left:50%; width:34px; height:34px;
    margin:-17px 0 0 -17px; border-radius:50%; background:#fff;
    box-shadow:0 2px 10px rgba(0,0,0,.5);
  }
  .tags{display:flex; justify-content:space-between; font-size:12px; color:var(--dim); margin-top:8px}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:14px}
  @media(max-width:640px){.grid{grid-template-columns:1fr}}
  .kv{font-size:13px; color:var(--dim)}
  .kv b{color:var(--fg); font-weight:600}
  footer{margin-top:28px; font-size:12px; color:#5c6474; line-height:1.9}
  .pill{display:inline-block; padding:1px 8px; border-radius:99px; background:#1e2532; color:var(--dim); font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>传图复原</h1>
  <div class="sub">
    消除微信等传输链路的压缩块效应与模糊。全部计算在<strong>你的浏览器本地</strong>完成，图片不会上传到任何服务器。
  </div>

  <div class="card">
    <div id="drop">
      <div style="font-size:15px;margin-bottom:6px"><b>点击选择</b> 或把图片拖到这里</div>
      <div style="font-size:13px">支持 JPG / PNG，建议长边不超过 2048</div>
      <input id="file" type="file" accept="image/*" hidden />
    </div>

    <div class="row">
      <button id="run" disabled>开始复原</button>
      <button id="dl" class="ghost" disabled>下载结果</button>
      <span class="pill" id="dev">初始化中…</span>
    </div>

    <div id="bar"><i></i></div>
    <div id="status"></div>

    <div id="view">
      <div class="compare" id="cmp">
        <canvas id="cvBefore"></canvas>
        <canvas id="cvAfter" class="after"></canvas>
        <div class="handle" id="hd"></div>
      </div>
      <div class="tags"><span>← 拖动分割线对比 →</span><span id="sz"></span></div>
      <div class="grid">
        <div class="kv">耗时：<b id="t1">-</b></div>
        <div class="kv">分块：<b id="t2">-</b></div>
      </div>
    </div>
  </div>

  <footer>
    模型：SRVGGNetCompact（1.15M 参数）· ONNX Runtime Web · 纯前端推理<br />
    局限：2 倍下采样丢失的细节无法真正重建，模型只做去伪影与合理补全，不承诺还原原始细节。
  </footer>
</div>

<script src="./coi-serviceworker.min.js"></script>
<script src="./ort/ort.min.js"></script>
<script>
// 不手动设置 wasmPaths：ort.min.js 会从自身所在目录 ./ort/ 自动推断，
// 手动设置会导致路径被拼接两次。
ort.env.wasm.simd = true;
// 多线程需要 SharedArrayBuffer（要求 COOP/COEP 响应头），GitHub Pages 没有，自动退回单线程
ort.env.wasm.numThreads = self.crossOriginIsolated
  ? Math.min(4, navigator.hardwareConcurrency || 1) : 1;

const $ = (id) => document.getElementById(id);
const TILE = 384, OVERLAP = 32, MAX_SIDE = 2048;

let session = null, srcImg = null, outCanvas = null;

const setStatus = (t) => { $("status").textContent = t; };
const setProgress = (p) => {
  $("bar").style.display = p == null ? "none" : "block";
  if (p != null) $("bar").firstElementChild.style.width = `${Math.round(p * 100)}%`;
};

async function init() {
  try {
    const EP = new URLSearchParams(location.search).get("ep") || "wasm";
    session = await ort.InferenceSession.create("./restore.onnx", {
      executionProviders: [EP], graphOptimizationLevel: "all",
    });
    $("dev").textContent = `${EP.toUpperCase()} · ${self.crossOriginIsolated ? "多线程" : "单线程"}`;
    setStatus("模型已就绪，选择一张图片开始。");
  } catch (e) {
    $("dev").textContent = "加载失败";
    setStatus("模型加载失败：" + e.message + "（请用本地 http 服务打开，不要直接双击 html）");
  }
}

// ---------- 图片读入 ----------
function readFile(file) {
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    URL.revokeObjectURL(url);
    let { width: w, height: h } = img;
    const s = Math.min(1, MAX_SIDE / Math.max(w, h));
    w = Math.round(w * s); h = Math.round(h * s);
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    c.getContext("2d").drawImage(img, 0, 0, w, h);
    srcImg = c;
    $("cvBefore").width = w; $("cvBefore").height = h;
    $("cvBefore").getContext("2d").drawImage(c, 0, 0);
    $("view").style.display = "block";
    $("cvAfter").style.display = "none";
    $("run").disabled = false;
    $("dl").disabled = true;
    $("sz").textContent = `${w} × ${h}`;
    setStatus(s < 1 ? `原图过大，已缩放到 ${w}×${h} 处理` : "图片已载入");
  };
  img.src = url;
}

// ---------- 推理核心 ----------
function canvasToCHW(cv, x, y, w, h) {
  const ctx = cv.getContext("2d", { willReadFrequently: true });
  const d = ctx.getImageData(x, y, w, h).data;
  const out = new Float32Array(3 * w * h);
  const n = w * h;
  for (let i = 0; i < n; i++) {
    out[i] = d[i * 4] / 255;
    out[n + i] = d[i * 4 + 1] / 255;
    out[2 * n + i] = d[i * 4 + 2] / 255;
  }
  return out;
}

async function inferPatch(cv, x, y, w, h) {
  const t = new ort.Tensor("float32", canvasToCHW(cv, x, y, w, h), [1, 3, h, w]);
  const r = await session.run({ input: t });
  return { data: r.output.data, w, h };
}

function feather(n, ov) {
  const w = new Float32Array(n).fill(1);
  for (let i = 0; i < ov; i++) {
    const v = 0.01 + 0.99 * (i / ov);
    if (v < w[i]) w[i] = v;
    const j = n - 1 - i;
    if (v < w[j]) w[j] = v;
  }
  return w;
}

function starts(total, tile, ov) {
  if (total <= tile) return [0];
  const step = tile - ov, pos = [];
  for (let p = 0; p <= total - tile; p += step) pos.push(p);
  if (pos[pos.length - 1] !== total - tile) pos.push(total - tile);
  return pos;
}

async function restore(cv) {
  const W = cv.width, H = cv.height;
  const ys = starts(H, TILE, OVERLAP), xs = starts(W, TILE, OVERLAP);
  const total = ys.length * xs.length;
  const out = new Float32Array(3 * W * H);
  const wsum = new Float32Array(W * H);
  const t0 = performance.now();
  let done = 0;

  for (const y of ys) {
    for (const x of xs) {
      const { data, w: tw, h: th } = await inferPatch(cv, x, y, TILE, TILE);
      const fy = feather(th, OVERLAP), fx = feather(tw, OVERLAP);
      const n = tw * th;      // 块内像素数，用于索引单块的 data
      const CH = W * H;       // 整图通道偏移，用于索引 out
      for (let j = 0; j < th; j++) {
        for (let i = 0; i < tw; i++) {
          const wt = fy[j] * fx[i];
          const gi = (y + j) * W + (x + i);
          const pi = j * tw + i;
          out[gi] += data[pi] * wt;
          out[CH + gi] += data[n + pi] * wt;
          out[2 * CH + gi] += data[2 * n + pi] * wt;
          wsum[gi] += wt;
        }
      }
      done++;
      setProgress(done / total);
      setStatus(`处理中 ${done}/${total} 块…`);
      await new Promise((r) => setTimeout(r, 0)); // 让 UI 有机会刷新
    }
  }

  const outCv = document.createElement("canvas");
  outCv.width = W; outCv.height = H;
  const octx = outCv.getContext("2d");
  const imgData = octx.createImageData(W, H);
  const px = imgData.data;
  for (let i = 0; i < W * H; i++) {
    const k = 1 / (wsum[i] || 1);
    px[i * 4] = Math.max(0, Math.min(255, out[i] * k * 255));
    px[i * 4 + 1] = Math.max(0, Math.min(255, out[W * H + i] * k * 255));
    px[i * 4 + 2] = Math.max(0, Math.min(255, out[2 * W * H + i] * k * 255));
    px[i * 4 + 3] = 255;
  }
  octx.putImageData(imgData, 0, 0);

  return { canvas: outCv, ms: performance.now() - t0, blocks: total };
}

// ---------- 交互 ----------
$("drop").onclick = () => $("file").click();
$("file").onchange = (e) => e.target.files[0] && readFile(e.target.files[0]);
["dragenter", "dragover"].forEach((ev) =>
  $("drop").addEventListener(ev, (e) => { e.preventDefault(); $("drop").classList.add("on"); }));
["dragleave", "drop"].forEach((ev) =>
  $("drop").addEventListener(ev, (e) => { e.preventDefault(); $("drop").classList.remove("on"); }));
$("drop").addEventListener("drop", (e) => {
  const f = e.dataTransfer.files[0];
  if (f && f.type.startsWith("image/")) readFile(f);
});

$("run").onclick = async () => {
  if (!srcImg || !session) return;
  $("run").disabled = true;
  setProgress(0);
  try {
    const r = await restore(srcImg);
    outCanvas = r.canvas;
    const ca = $("cvAfter");
    ca.width = r.canvas.width; ca.height = r.canvas.height;
    ca.getContext("2d").drawImage(r.canvas, 0, 0);
    ca.style.display = "block";
    $("t1").textContent = `${(r.ms / 1000).toFixed(1)} s`;
    $("t2").textContent = `${r.blocks} 块 · ${TILE}px`;
    $("dl").disabled = false;
    setProgress(null);
    setStatus("完成。拖动中间的白色分割线对比前后。");
  } catch (e) {
    setStatus("处理失败：" + e.message);
    setProgress(null);
  } finally {
    $("run").disabled = false;
  }
};

$("dl").onclick = () => {
  if (!outCanvas) return;
  const a = document.createElement("a");
  a.download = "restored.png";
  a.href = outCanvas.toDataURL("image/png");
  a.click();
};

// 对比滑块
const cmp = $("cmp"), hd = $("hd"), after = $("cvAfter");
let dragging = false;
const move = (clientX) => {
  const rect = cmp.getBoundingClientRect();
  const p = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
  after.style.clipPath = `inset(0 0 0 ${p * 100}%)`;
  hd.style.left = `${p * 100}%`;
};
cmp.addEventListener("pointerdown", (e) => { dragging = true; move(e.clientX); });
window.addEventListener("pointermove", (e) => dragging && move(e.clientX));
window.addEventListener("pointerup", () => (dragging = false));

init();
</script>
</body>
</html>
